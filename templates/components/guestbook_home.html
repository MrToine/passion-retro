{% extends 'layout.html' %}
{% load users_custom_tags %}

{% block content %}
<div class="container">
    <h2>Livre d'Or</h2>
    <div class="guestbook">
        {% for message in guestbook %}    
            <p>Le {{ message.created }}, <span class="author">{{ message.author }}</span> à dit : {{ message.content }}</p>
        {% endfor %}
    </div>
    <h3 id="form">Laisser un message</h3>
    <form action="" method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button>Envoyer</button>
    </form>
</div>
{% endblock %}
