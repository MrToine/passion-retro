{% extends "layout.html" %}

{% block content %}
    <div class="container">
        <h2>Modifier le post : {{ post.title }}</h2>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="form-inline">
                <button type="submit" class="btn btn-primary">Enregistrer</button>
                <a href="{% url 'contributions' %}" class="btn btn-danger">Annuler</a>
            </div>
        </form>

    </div>
{% endblock %}
